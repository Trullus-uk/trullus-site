<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Trullus</title>
  <meta property="og:title" content="Trullus" />
  <meta property="og:description" content="Check out my recommendations on Trullus" />
  <meta property="og:image" content="https://trullus.uk/og-image.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="1200" />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #FAF7F2;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
      color: #1C1C1E;
      font-size: 16px;
      line-height: 1.65;
      min-height: 100vh;
      padding-bottom: 160px;
      display: flex;
      flex-direction: column;
    }
    #app {
      flex: 1;
    }

    /* Header — rebuilt as markup rather than an image. It previously rendered
       og-image.png, which is 1200x1200 square for WhatsApp preview cropping, so at
       width:100% the banner was as tall as the viewport is wide. The OG meta tag
       still points at that file; the on-page header no longer depends on it. */
    header {
      display: block;
      text-align: center;
      background: #2D4A3E;
      padding: 20px 20px 18px;
    }
    .brand-mark {
      display: block;
      margin: 0 auto 8px;
    }
    .brand-name {
      font-family: 'Playfair Display', serif;
      font-size: 23px;
      font-weight: 700;
      color: #FAF7F2;
      line-height: 1.1;
    }
    .brand-tagline {
      font-size: 9.5px;
      letter-spacing: 1.4px;
      text-transform: uppercase;
      color: #C9A46B;
      margin-top: 5px;
    }
    @media (min-width: 600px) {
      header { padding: 26px 20px 22px; }
      .brand-name { font-size: 27px; }
      .brand-tagline { font-size: 10.5px; letter-spacing: 1.6px; }
    }

    /* Content container */
    .content {
      max-width: 600px;
      margin: 0 auto;
      padding: 28px 20px;
    }
    @media (min-width: 600px) {
      .content { padding: 40px; }
    }

    /* Profile section */
    .profile-header {
      text-align: center;
      padding: 32px 0 24px;
    }
    .avatar {
      width: 72px;
      height: 72px;
      border-radius: 36px;
      background: #E8DFD0;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 16px;
      font-family: 'Playfair Display', serif;
      font-size: 26px;
      font-weight: 700;
      color: #2D4A3E;
    }
    .profile-name {
      font-family: 'Playfair Display', serif;
      font-size: 22px;
      font-weight: 700;
      color: #1C1C1E;
      margin-bottom: 4px;
    }
    .profile-handle {
      font-size: 14px;
      color: #8A8580;
    }
    .stats-row {
      display: flex;
      justify-content: center;
      gap: 40px;
      margin-top: 20px;
    }
    .stat { text-align: center; }
    .stat-number { font-size: 22px; font-weight: 800; color: #1C1C1E; }
    .stat-label { font-size: 12px; color: #8A8580; margin-top: 2px; }

    /* Section */
    .section-title {
      font-family: 'Playfair Display', serif;
      font-size: 18px;
      font-weight: 700;
      color: #1C1C1E;
      margin-bottom: 16px;
    }

    /* Location card */
    .location-card {
      background: #FFFFFF;
      border-radius: 16px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      padding: 18px 20px;
      margin-bottom: 12px;
      cursor: pointer;
      user-select: none;
      transition: box-shadow 0.15s;
    }
    .location-card:hover { box-shadow: 0 4px 18px rgba(0,0,0,0.1); }
    .location-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .location-info { flex: 1; }
    .location-city {
      font-weight: 700;
      font-size: 16px;
      color: #1C1C1E;
    }
    .location-country {
      font-size: 13px;
      color: #8A8580;
      margin-top: 2px;
    }
    .location-right {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      margin-left: 12px;
    }
    .rec-count {
      font-size: 12px;
      color: #8A8580;
      white-space: nowrap;
    }
    .expand-icon {
      font-size: 13px;
      color: #8A8580;
      transition: transform 0.2s;
    }
    .location-card.open .expand-icon { transform: rotate(180deg); }

    /* Recommendations panel */
    .recs-panel {
      display: none;
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid #E8DFD0;
    }
    .location-card.open .recs-panel { display: block; }

    .rec-item {
      padding: 12px 0;
      border-bottom: 1px solid #F0EBE3;
    }
    .rec-item:last-child { border-bottom: none; padding-bottom: 0; }
    .rec-item:first-child { padding-top: 0; }

    .category-pill {
      display: inline-block;
      border-radius: 20px;
      padding: 3px 10px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }
    .rec-name {
      font-size: 15px;
      font-weight: 700;
      color: #1C1C1E;
      margin-bottom: 4px;
    }
    .rec-note {
      font-size: 13px;
      color: #5A5550;
      font-style: italic;
      line-height: 1.5;
      border-left: 3px solid #E8DFD0;
      padding-left: 10px;
      margin-top: 6px;
    }
    .no-recs {
      font-size: 14px;
      color: #8A8580;
      font-style: italic;
    }

    /* Location note */
    .location-note {
      font-size: 13px;
      color: #5A5550;
      font-style: italic;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* State messages */
    .state-container {
      text-align: center;
      padding: 64px 24px 32px;
    }
    .state-title {
      font-family: 'Playfair Display', serif;
      font-size: 24px;
      font-weight: 700;
      color: #1C1C1E;
      margin-bottom: 12px;
    }
    .state-body {
      font-size: 15px;
      color: #8A8580;
      line-height: 1.65;
      margin-bottom: 28px;
      max-width: 360px;
      margin-left: auto;
      margin-right: auto;
    }
    .store-buttons {
      display: flex;
      gap: 12px;
      justify-content: center;
      flex-wrap: wrap;
    }
    .store-btn {
      background: #C4622D;
      color: #FAF7F2;
      border-radius: 14px;
      padding: 14px 28px;
      font-weight: 600;
      font-size: 15px;
      text-decoration: none;
      cursor: default;
      display: inline-block;
      min-width: 140px;
      text-align: center;
    }

    /* Loading */
    .loading-container {
      text-align: center;
      padding: 80px 24px;
      color: #8A8580;
      font-size: 15px;
    }

    /* Sticky CTA */
    .sticky-cta {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #2D4A3E;
      color: #FAF7F2;
      padding: 16px 20px 20px;
      z-index: 100;
    }
    .cta-headline {
      font-size: 15px;
      font-weight: 700;
      color: #FAF7F2;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .cta-subtext {
      font-size: 12px;
      color: rgba(250,247,242,0.75);
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .sticky-cta-buttons {
      display: flex;
      gap: 10px;
      justify-content: flex-start;
      align-items: center;
    }
    .sticky-store-btn {
      display: inline-block;
      cursor: default;
      line-height: 0;
    }
    .sticky-store-btn img[alt="Download on the App Store"] {
      height: 40px;
      display: block;
    }
    .sticky-store-btn img[alt="Get it on Google Play"] {
      height: 54px;
      display: block;
    }
    @media (min-width: 600px) {
      .sticky-cta { padding: 16px 24px 20px; }
      .sticky-cta-buttons { max-width: 360px; }
    }

    /* Footer */
    footer {
      text-align: center;
      padding: 14px 20px;
    }
    footer a {
      font-size: 11px;
      color: rgba(28,28,30,0.3);
      text-decoration: none;
    }
  </style>
</head>
<body>

  <header>
    <svg class="brand-mark" width="46" height="46" viewBox="0 0 100 100" aria-hidden="true">
      <polygon points="50,6 96,90 4,90" fill="#243B31"/>
      <polygon points="50,19 87,84 13,84" fill="#C4622D"/>
      <path d="M13,84 Q50,69 87,84 Z" fill="#FAF7F2"/>
      <ellipse cx="36" cy="56" rx="5" ry="7" fill="#1C1C1E"/>
      <ellipse cx="50" cy="49" rx="5" ry="7" fill="#1C1C1E"/>
      <ellipse cx="64" cy="56" rx="5" ry="7" fill="#1C1C1E"/>
      <ellipse cx="43" cy="71" rx="4.6" ry="6.5" fill="#1C1C1E"/>
      <ellipse cx="57" cy="71" rx="4.6" ry="6.5" fill="#1C1C1E"/>
    </svg>
    <div class="brand-name">Trullus</div>
    <div class="brand-tagline">Your friends' favourite places</div>
  </header>

  <main id="app">
    <div class="loading-container" id="loading-state">
      <p>Loading…</p>
    </div>
  </main>

  <!-- Sticky download CTA — shown once a valid profile is loaded -->
  <div class="sticky-cta" id="sticky-cta" style="display:none">
    <p class="cta-headline" id="cta-headline"></p>
    <p class="cta-subtext" id="cta-subtext"></p>
    <div class="sticky-cta-buttons">
      <!-- TODO: Replace href with real App Store URL before public release -->
      <a class="sticky-store-btn" onclick="return false">
        <img src="https://tools.applemediaservices.com/api/badges/download-on-the-app-store/black/en-us?size=250x83" alt="Download on the App Store" />
      </a>
      <!-- TODO: Replace href with real Google Play URL before public release -->
      <a class="sticky-store-btn" onclick="return false">
        <img src="https://play.google.com/intl/en_us/badges/static/images/badges/en_badge_web_generic.png" alt="Get it on Google Play" />
      </a>
    </div>
    <div style="margin-top:10px;font-size:11px;color:rgba(250,247,242,0.4);">
      <a href="/privacy" style="color:inherit;text-decoration:none;">Privacy Policy</a>
      &nbsp;·&nbsp;
      <a href="/terms" style="color:inherit;text-decoration:none;">Terms of Use</a>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://kcwntjuprqdsfqlioeiz.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imtjd250anVwcnFkc2ZxbGlvZWl6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAzNDU3MDEsImV4cCI6MjA5NTkyMTcwMX0.4iGVxZpFGgC7GR35100jwMdEMM8JLM872SoFfKcJMMM';

    const CATEGORY_META = {
      eat:      { label: 'Eat',      color: '#C4622D' },
      cafe_bar: { label: 'Cafe/Bar', color: '#D4A853' },
      explore:  { label: 'Explore',  color: '#2D7A4A' },
      do:       { label: 'Do',       color: '#2D4A3E' },
      shop:     { label: 'Shop',     color: '#2E7D8C' },
      stay:     { label: 'Stay',     color: '#6B5B8E' },
      party:    { label: 'Party',    color: '#9B3A8C' },
    };

    const CATEGORY_SVG = {
      eat:      `<path d="M7 4v4.5M10 4v4.5" stroke="COLOR" stroke-width="1.75" stroke-linecap="round"/><path d="M7 8.5Q8.5 11 10 8.5" stroke="COLOR" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M8.5 11v9" stroke="COLOR" stroke-width="1.75" stroke-linecap="round"/><path d="M15 4c2 0 2.5 3 0 5v11" stroke="COLOR" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>`,
      cafe_bar: `<path d="M7.5 5h9" stroke="COLOR" stroke-width="1.75" stroke-linecap="round"/><path d="M7.5 5Q7.5 14 12 15.5Q16.5 14 16.5 5" stroke="COLOR" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M12 15.5v3.5" stroke="COLOR" stroke-width="1.75" stroke-linecap="round"/><path d="M9 19h6" stroke="COLOR" stroke-width="1.75" stroke-linecap="round"/>`,
      explore:  `<path d="M2 20L9 6l4 8 3.5-5.5L22 20H2z" stroke="COLOR" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>`,
      do:       `<path d="M14 2L7 13h5l-2 9 8-11h-5l2-9z" stroke="COLOR" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>`,
      shop:     `<path d="M6.5 8h11l-0.7 11.2a1.3 1.3 0 0 1-1.3 1.2H8.5a1.3 1.3 0 0 1-1.3-1.2L6.5 8z" stroke="COLOR" stroke-width="1.75" stroke-linejoin="round"/><path d="M9.2 8V6.6a2.8 2.8 0 0 1 5.6 0V8" stroke="COLOR" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/>`,
      stay:     `<path d="M3 12V7c0-1.657 1.343-3 3-3h12c1.657 0 3 1.343 3 3v5" stroke="COLOR" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 12v8M21 12v8" stroke="COLOR" stroke-width="1.75" stroke-linecap="round"/><path d="M3 12h18" stroke="COLOR" stroke-width="1.75" stroke-linecap="round"/><path d="M3 20h18" stroke="COLOR" stroke-width="1.75" stroke-linecap="round"/><rect x="5" y="9.5" width="5" height="2.5" rx="1" stroke="COLOR" stroke-width="1.5"/><rect x="14" y="9.5" width="5" height="2.5" rx="1" stroke="COLOR" stroke-width="1.5"/>`,
      party:    `<path d="M9 18V7l8-2v11" stroke="COLOR" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="7" cy="18.5" rx="2.5" ry="2" stroke="COLOR" stroke-width="1.75"/><ellipse cx="15" cy="16.5" rx="2.5" ry="2" stroke="COLOR" stroke-width="1.75"/>`,
    };

    function categoryIcon(key, color) {
      const inner = (CATEGORY_SVG[key] || '').replace(/COLOR/g, color);
      return `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="vertical-align:middle;margin-right:3px">${inner}</svg>`;
    }

    function isMobilePhone() {
      // Match Android phones (has "Mobile" in UA) and iPhones (not iPads, which say "iPad")
      return /Android.*Mobile|iPhone/.test(navigator.userAgent);
    }

    function getInitials(firstName, lastName) {
      return ((firstName || '').charAt(0) + (lastName || '').charAt(0)).toUpperCase();
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function renderExpired() {
      document.getElementById('app').innerHTML = `
        <div class="state-container">
          <div class="state-title">This link has expired.</div>
          <p class="state-body">
            Public links expire after 24 hours. Download Trullus for uninterrupted access to friends recommendations!
          </p>
        </div>
      `;
      showStateCta();
    }

    function renderNotFound() {
      document.getElementById('app').innerHTML = `
        <div class="state-container">
          <div class="state-title">This profile couldn't be found.</div>
          <p class="state-body">
            The link you followed doesn't match any profile on Trullus.
          </p>
        </div>
      `;
      showStateCta();
    }

    function showStateCta() {
      document.getElementById('cta-headline').textContent =
        'Join Trullus for free to connect with friends and share recommendations!';
      document.getElementById('cta-subtext').textContent =
        'Trullus is available on iOS and Android. This link expires in 24 hours.';
      document.getElementById('sticky-cta').style.display = 'block';
    }

    function renderProfile(profile, locations, recsByLocation) {
      const totalRecs = locations.reduce((sum, loc) => sum + (recsByLocation[loc.id] || []).length, 0);
      const initials = getInitials(profile.first_name, profile.last_name);

      const locationCards = locations.map(loc => {
        const recs = recsByLocation[loc.id] || [];
        const recCount = recs.length;
        const countLabel = recCount === 1 ? '1 rec' : `${recCount} recs`;

        const recsHtml = recs.length === 0
          ? `<p class="no-recs">No recommendations yet.</p>`
          : recs.map(rec => {
              const meta = CATEGORY_META[rec.category] || {};
              const pillStyle = meta.color
                ? `background:${meta.color}25;color:${meta.color}`
                : 'background:#E8DFD0;color:#8A8580';
              const noteHtml = rec.note
                ? `<div class="rec-note">${escapeHtml(rec.note)}</div>`
                : '';
              return `
                <div class="rec-item">
                  <div class="category-pill" style="${pillStyle}">
                    ${categoryIcon(rec.category, meta.color || '#8A8580')} ${escapeHtml(meta.label || rec.category).toUpperCase()}
                  </div>
                  <div class="rec-name">${escapeHtml(rec.place_name)}</div>
                  ${noteHtml}
                </div>
              `;
            }).join('');

        const noteHtml = loc.note
          ? `<div class="location-note">${escapeHtml(loc.note)}</div>`
          : '';

        return `
          <div class="location-card" onclick="toggleLocation(this)">
            <div class="location-card-header">
              <div class="location-info">
                <div class="location-city">${escapeHtml(loc.city)}</div>
                <div class="location-country">${escapeHtml(loc.country)}</div>
              </div>
              <div class="location-right">
                <div class="rec-count">${countLabel}</div>
                <div class="expand-icon">▼</div>
              </div>
            </div>
            <div class="recs-panel">
              ${noteHtml}
              ${recsHtml}
            </div>
          </div>
        `;
      }).join('');

      const locationsSection = locations.length === 0
        ? `<p style="color:#8A8580;font-style:italic;text-align:center">${escapeHtml(profile.first_name)} hasn't saved any recommendations yet.</p>`
        : `
          <div class="section-title">Locations</div>
          ${locationCards}
        `;

      document.getElementById('app').innerHTML = `
        <div class="content">
          <div class="profile-header">
            <div class="avatar">${escapeHtml(initials)}</div>
            <div class="profile-name">${escapeHtml(profile.first_name)} ${escapeHtml(profile.last_name)}</div>
            <div class="profile-handle">@${escapeHtml(profile.handle)}</div>
            <div class="stats-row">
              <div class="stat">
                <div class="stat-number">${locations.length}</div>
                <div class="stat-label">locations</div>
              </div>
              <div class="stat">
                <div class="stat-number">${totalRecs}</div>
                <div class="stat-label">recs</div>
              </div>
            </div>
          </div>
          ${locationsSection}
        </div>
      `;

      // Update and show sticky CTA
      document.getElementById('cta-headline').textContent =
        `Join Trullus for free to see ${profile.first_name}'s recommendations in full and connect with other friends!`;
      document.getElementById('cta-subtext').textContent =
        `Trullus is available on iOS and Android. This link expires in 24 hours.`;
      document.getElementById('sticky-cta').style.display = 'block';
    }

    function toggleLocation(card) {
      card.classList.toggle('open');
    }

    async function init() {
      // Parse handle and token from query params (?u=handle&token=xxx)
      const params = new URLSearchParams(window.location.search);
      const handle = params.get('u');
      const token = params.get('token');

      if (!handle) { renderNotFound(); return; }
      if (!token)  { renderExpired();  return; }

      try {
        const res = await fetch(
          `${SUPABASE_URL}/functions/v1/get-shared-profile?token=${encodeURIComponent(token)}`,
          { headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': `Bearer ${SUPABASE_ANON_KEY}` } }
        );

        if (!res.ok) { renderExpired(); return; }

        const { profile, locations, recsByLocation } = await res.json();

        // Tamper check: token must belong to the handle in the URL
        if (!profile || profile.handle !== handle) { renderExpired(); return; }

        if (isMobilePhone()) {
          window.location.href = `trullus://${encodeURIComponent(handle)}`;
        }

        renderProfile(profile, locations, recsByLocation);

      } catch (err) {
        console.error('Trullus load error:', err);
        renderNotFound();
      }
    }

    init();
  </script>
</body>
</html>
